# הגדרות העלאה ל־Render (Blueprint)
services:
  - type: web
    name: nameing-web-client
    runtime: static
    branch: design/ui-refresh
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      # כתובת השרת ב־Render, בלי "/" בסוף
      - key: VITE_API_URL
        value: https://ameing-gifts-api.onrender.com
      - key: NODE_VERSION
        value: "22"
    # כל נתיב (למשל /cart או /products/3) מחזיר את index.html, כדי שרענון עמוד לא ייתן 404
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
